name: Rasterizer validation
on:
  workflow_dispatch:
  push:
    branches: ['codex/rasterizer-validation-*']
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Build the retained corrected scalar source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scalar-source"
          git archive 811143b | tar -x -C "$RUNNER_TEMP/scalar-source"
      - name: Package tests and same-platform scalar comparisons
        shell: Rscript {0}
        run: |
          source("tools/validate-rasterizer-portable.R")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rasterizer-${{ matrix.os }}
          path: validation-results
